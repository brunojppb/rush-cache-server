name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, e.g. 1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  sanity-check:
    name: Sanity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/set-version.py "$RELEASE_VERSION"
      - name: Ensure release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be created from the main branch."
          exit 1

  build:
    name: Build
    needs: sanity-check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ inputs.version }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Stage release version
        run: python3 .github/scripts/set-version.py "$VERSION"

      - name: Download binaries into action directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-binaries"
          merge-multiple: true
          path: action

      - name: Make binaries executable
        run: |
          chmod +x action/rush-cache-server-x64
          chmod +x action/rush-cache-server-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage prebuilt Linux executables
        run: |
          mkdir -p image/linux/amd64 image/linux/arm64
          cp action/rush-cache-server-x64 image/linux/amd64/rush-cache-server
          cp action/rush-cache-server-arm64 image/linux/arm64/rush-cache-server

      - name: Build and push Docker images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REPO: ${{ github.repository }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rush-cache-server:${{ env.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/rush-cache-server:latest
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest

      - name: Commit release with binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git add action/rush-cache-server-x64
          git add action/rush-cache-server-arm64
          git commit -m "Release v${VERSION}"

      - name: Create and push tag
        run: |
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin main --follow-tags

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline)
          else
            CHANGELOG=$(git log --oneline "${PREV_TAG}..v${VERSION}")
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REPO: ${{ github.repository }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "v${{ env.VERSION }}"
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Downloads
            | Platform | Binary |
            |----------|--------|
            | Linux x86_64 | [`rush-cache-server-x64`](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/rush-cache-server-x64) |
            | Linux ARM64 | [`rush-cache-server-arm64`](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/rush-cache-server-arm64) |

            ## Docker Images
            - `docker pull ${{ secrets.DOCKER_USERNAME }}/rush-cache-server:${{ env.VERSION }}`
            - `docker pull ghcr.io/${{ github.repository }}:${{ env.VERSION }}`

            ## Run with Docker
            ```bash
            docker run -d \
              --name rush-cache-server \
              -p 8080:8080 \
              -e S3_BUCKET=my-rush-cache \
              -e S3_REGION=us-east-1 \
              -e CACHE_TOKENS_READ_ONLY=tok_ro_1 \
              -e CACHE_TOKENS_READ_WRITE=tok_rw_1 \
              ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ```
          files: |
            action/rush-cache-server-x64
            action/rush-cache-server-arm64
